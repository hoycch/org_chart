<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>團隊組織架構圖</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --border: #2d3a4f;
      --text: #e7ecf3;
      --muted: #8b9bb4;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --positive: #22c55e;
      --negative: #ef4444;
      --link: #475569;
      --highlight: #fbbf24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "PingFang HK", "Noto Sans TC", "Microsoft JhengHei", "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      z-index: 10;
    }
    h1 { font-size: 1.25rem; font-weight: 600; white-space: nowrap; }
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      flex-wrap: wrap;
    }
    .search-box {
      display: flex;
      align-items: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 12px;
      min-width: 200px;
      flex: 1;
      max-width: 320px;
    }
    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 0.95rem;
      width: 100%;
      font-family: inherit;
    }
    .search-box input::placeholder { color: var(--muted); }
    button {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.875rem;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
      transition: background 0.15s;
    }
    button:hover { background: var(--accent-hover); }
    button.secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    button.secondary:hover { background: var(--border); }
    #chart { flex: 1; position: relative; overflow: hidden; }
    svg { width: 100%; height: 100%; cursor: grab; }
    svg:active { cursor: grabbing; }
    .node circle {
      stroke-width: 2px;
      cursor: pointer;
      transition: r 0.15s, stroke-width 0.15s;
    }
    .node circle:hover { stroke-width: 3px; }
    .node text {
      font-size: 12px;
      fill: var(--text);
      pointer-events: none;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }
    .node text.name { font-weight: 500; }
    .node text.meta { font-size: 10px; fill: var(--muted); }
    .link {
      fill: none;
      stroke: var(--link);
      stroke-width: 1.5px;
      stroke-opacity: 0.65;
    }
    .link.highlight {
      stroke: var(--highlight);
      stroke-width: 2.5px;
      stroke-opacity: 1;
    }
    .node.highlight circle {
      stroke: var(--highlight) !important;
      stroke-width: 3px;
    }
    .node.search-target circle {
      stroke: #f59e0b !important;
      stroke-width: 4px;
      filter: drop-shadow(0 0 6px #f59e0b);
    }
    .tooltip {
      position: absolute;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
      z-index: 20;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      max-width: 280px;
      font-size: 0.875rem;
    }
    .tooltip.visible { opacity: 1; }
    .tooltip .title { font-weight: 600; margin-bottom: 6px; font-size: 1rem; }
    .tooltip .row { display: flex; justify-content: space-between; gap: 16px; margin: 4px 0; }
    .tooltip .label { color: var(--muted); }
    .tooltip .pos { color: var(--positive); font-weight: 600; }
    .tooltip .neg { color: var(--negative); font-weight: 600; }
    .legend {
      position: absolute;
      bottom: 16px;
      left: 16px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.8rem;
      z-index: 5;
      display: flex;
      gap: 14px;
      align-items: center;
      flex-wrap: wrap;
    }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .legend-dot {
      width: 12px; height: 12px; border-radius: 50%;
      border: 2px solid;
    }
    .stats { color: var(--muted); font-size: 0.8rem; white-space: nowrap; }
    .search-result {
      position: absolute;
      top: 16px;
      right: 16px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.85rem;
      z-index: 5;
      max-width: 300px;
      display: none;
    }
    .search-result.visible { display: block; }
  </style>
</head>

    const duration = 300;
    const nodeRadius = 9;
    let width, height;
    let root, i = 0;
    let zoomBehavior, svg, g, gLink, gNode;
    let highlightedIds = new Set();
    let searchTargetId = null;

    function init() {
      const chart = document.getElementById('chart');
      width = chart.clientWidth;
      height = chart.clientHeight;

      zoomBehavior = d3.zoom()
        .scaleExtent([0.08, 3])
        .on('zoom', (event) => g.attr('transform', event.transform));

      svg = d3.select('#chart').append('svg')
        .attr('width', width)
        .attr('height', height)
        .call(zoomBehavior)
        .on('dblclick.zoom', null);

      g = svg.append('g');
      gLink = g.append('g').attr('class', 'links');
      gNode = g.append('g').attr('class', 'nodes');

      root = d3.hierarchy(TREE_DATA, d => d.children);
      root.x0 = height / 2;
      root.y0 = 0;

      // 預設：展開第一層，其餘收合（266 節點較多）
      if (root.children) {
        root.children.forEach(d => {
          if (d.children) {
            d._children = d.children;
            d.children = null;
          }
        });
      }

      update(root);
      centerView();
      updateStats();

      document.getElementById('btnSearch').addEventListener('click', doSearch);
      document.getElementById('searchInput').addEventListener('keydown', e => {
        if (e.key === 'Enter') doSearch();
      });
      document.getElementById('btnExpand').addEventListener('click', expandAll);
      document.getElementById('btnCollapse').addEventListener('click', collapseAll);
      document.getElementById('btnReset').addEventListener('click', resetView);

      window.addEventListener('resize', () => {
        width = chart.clientWidth;
        height = chart.clientHeight;
        svg.attr('width', width).attr('height', height);
        update(root);
      });
    }

    function collapse(d) {
      if (d.children) {
        d._children = d.children;
        d._children.forEach(collapse);
        d.children = null;
      }
    }

    function expand(d) {
      if (d._children) {
        d.children = d._children;
        d._children = null;
      }
      if (d.children) d.children.forEach(expand);
    }

    function expandAll() {
      expand(root);
      update(root);
      updateStats();
    }

    function collapseAll() {
      function collapseDeep(d) {
        if (d.children) {
          d._children = d.children;
          d._children.forEach(collapseDeep);
          d.children = null;
        } else if (d._children) {
          d._children.forEach(collapseDeep);
        }
      }
      collapseDeep(root);
      if (root._children) {
        root.children = root._children;
        root._children = null;
        root.children.forEach(d => {
          if (d.children) {
            d._children = d.children;
            d.children = null;
          }
        });
      }
      update(root);
      centerView();
      updateStats();
    }

    function resetView() {
      highlightedIds.clear();
      searchTargetId = null;
      document.getElementById('searchResult').classList.remove('visible');
      document.getElementById('searchInput').value = '';
      collapseAll();
    }

    function centerView() {
      const scale = 0.6;
      const tx = 120;
      const ty = height / 2;
      svg.transition().duration(500)
        .call(zoomBehavior.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
    }

    function updateStats() {
      let total = 0, open = 0;
      root.each(d => {
        total++;
        if (d.children) open++;
      });
      document.getElementById('stats').textContent =
        `節點總數：${total - 1}　｜　已展開：${open}`;
    }

    function update(source) {
      const treeLayout = d3.tree()
        .nodeSize([28, 200])
        .separation((a, b) => a.parent === b.parent ? 1 : 1.15);

      const treeData = treeLayout(root);
      const nodes = treeData.descendants();
      const links = treeData.links();
      nodes.forEach(d => { d.y = d.depth * 200; });

      const node = gNode.selectAll('g.node')
        .data(nodes, d => d.id || (d.id = ++i));

      const nodeEnter = node.enter().append('g')
        .attr('class', 'node')
        .attr('transform', d => `translate(${source.y0},${source.x0})`)
        .on('click', (event, d) => {
          event.stopPropagation();
          toggle(d);
        })
        .on('mouseover', (event, d) => showTooltip(event, d))
        .on('mousemove', moveTooltip)
        .on('mouseout', hideTooltip);

      nodeEnter.append('circle')
        .attr('r', 1e-6)
        .attr('fill', d => colorFor(d))
        .attr('stroke', d => strokeFor(d));

      nodeEnter.append('text')
        .attr('class', 'name')
        .attr('dy', '-0.4em')
        .attr('x', d => d.children || d._children ? -12 : 12)
        .attr('text-anchor', d => d.children || d._children ? 'end' : 'start')
        .text(d => truncate(d.data.name, 16));

      nodeEnter.append('text')
        .attr('class', 'meta')
        .attr('dy', '1em')
        .attr('x', d => d.children || d._children ? -12 : 12)
        .attr('text-anchor', d => d.children || d._children ? 'end' : 'start')
        .text(d => d.data.id === 'root' ? '' : `ID: ${d.data.id}`);

      nodeEnter.append('text')
        .attr('class', 'child-count')
        .attr('dy', '0.35em')
        .attr('x', 0)
        .attr('text-anchor', 'middle')
        .attr('fill', '#fff')
        .attr('font-size', '9px')
        .attr('font-weight', 'bold')
        .style('pointer-events', 'none');

      const nodeUpdate = nodeEnter.merge(node);

      nodeUpdate.transition().duration(duration)
        .attr('transform', d => `translate(${d.y},${d.x})`);

      nodeUpdate.select('circle')
        .attr('r', d => d.data.id === 'root' ? 12 : nodeRadius)
        .attr('fill', d => colorFor(d))
        .attr('stroke', d => strokeFor(d))
        .attr('stroke-width', d => {
          if (searchTargetId && d.data.id === searchTargetId) return 4;
          if (highlightedIds.has(d.data.id)) return 3;
          return 2;
        });

      nodeUpdate.classed('highlight', d => highlightedIds.has(d.data.id));
      nodeUpdate.classed('search-target', d => d.data.id === searchTargetId);

      nodeUpdate.selectAll('text.name, text.meta')
        .attr('x', d => d.children || d._children ? -13 : 13)
        .attr('text-anchor', d => d.children || d._children ? 'end' : 'start');

      nodeUpdate.select('text.child-count')
        .text(d => {
          if (d.data.id === 'root') return '';
          const n = (d._children || d.children || []).length;
          return n > 0 ? n : '';
        });

      const nodeExit = node.exit().transition().duration(duration)
        .attr('transform', d => `translate(${source.y},${source.x})`)
        .remove();
      nodeExit.select('circle').attr('r', 1e-6);
      nodeExit.selectAll('text').style('fill-opacity', 1e-6);

      const link = gLink.selectAll('path.link')
        .data(links, d => d.target.id);

      const linkEnter = link.enter().insert('path', 'g')
        .attr('class', 'link')
        .attr('d', d => {
          const o = { x: source.x0, y: source.y0 };
          return diagonal(o, o);
        });

      linkEnter.merge(link)
        .classed('highlight', d =>
          highlightedIds.has(d.source.data.id) && highlightedIds.has(d.target.data.id))
        .transition().duration(duration)
        .attr('d', d => diagonal(d.source, d.target));

      link.exit().transition().duration(duration)
        .attr('d', d => {
          const o = { x: source.x, y: source.y };
          return diagonal(o, o);
        })
        .remove();

      nodes.forEach(d => { d.x0 = d.x; d.y0 = d.y; });
      updateStats();
    }

    function diagonal(s, d) {
      return `M ${s.y} ${s.x}
              C ${(s.y + d.y) / 2} ${s.x},
                ${(s.y + d.y) / 2} ${d.x},
                ${d.y} ${d.x}`;
    }

    function toggle(d) {
      if (d.children) {
        d._children = d.children;
        d.children = null;
      } else if (d._children) {
        d.children = d._children;
        d._children = null;
      }
      update(d);
    }

    function colorFor(d) {
      if (d.data.id === 'root') return '#3b82f6';
      const w = d.data.winloss;
      if (w == null) return '#64748b';
      if (w > 0) return '#22c55e';
      if (w < 0) return '#ef4444';
      return '#64748b';
    }

    function strokeFor(d) {
      if (d.data.id === 'root') return '#60a5fa';
      const w = d.data.winloss;
      if (w == null) return '#94a3b8';
      if (w > 0) return '#16a34a';
      if (w < 0) return '#dc2626';
      return '#94a3b8';
    }

    function truncate(str, len) {
      if (!str) return '';
      return str.length > len ? str.slice(0, len - 1) + '…' : str;
    }

    function formatNumber(n) {
      if (n == null) return '無資料';
      const abs = Math.abs(n);
      const formatted = abs.toLocaleString('zh-HK');
      return n > 0 ? '+' + formatted : n < 0 ? '-' + formatted : '0';
    }

    function escapeHtml(s) {
      const div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }

    const tooltip = document.getElementById('tooltip');
    function showTooltip(event, d) {
      if (d.data.id === 'root') {
        tooltip.innerHTML = '<div class="title">組織架構根</div><div class="row"><span class="label">說明</span><span>虛擬根節點</span></div>';
      } else {
        const w = d.data.winloss;
        const cls = w > 0 ? 'pos' : w < 0 ? 'neg' : '';
        tooltip.innerHTML =
          '<div class="title">' + escapeHtml(d.data.name) + '</div>' +
          '<div class="row"><span class="label">用戶 ID</span><span>' + d.data.id + '</span></div>' +
          '<div class="row"><span class="label">盈虧</span><span class="' + cls + '">' + formatNumber(w) + '</span></div>' +
          '<div class="row"><span class="label">下線人數</span><span>' + ((d._children || d.children || []).length) + '</span></div>';
      }
      tooltip.classList.add('visible');
      moveTooltip(event);
    }
    function moveTooltip(event) {
      tooltip.style.left = (event.clientX + 14) + 'px';
      tooltip.style.top = (event.clientY + 14) + 'px';
    }
    function hideTooltip() {
      tooltip.classList.remove('visible');
    }

    function doSearch() {
      const q = document.getElementById('searchInput').value.trim();
      if (!q) {
        highlightedIds.clear();
        searchTargetId = null;
        document.getElementById('searchResult').classList.remove('visible');
        update(root);
        return;
      }

      // 從完整 hierarchy 找路徑
      const fullRoot = d3.hierarchy(TREE_DATA, d => d.children);
      let pathIds = null;
      fullRoot.each(d => {
        if (String(d.data.id) === q) {
          pathIds = d.ancestors().map(a => a.data.id).reverse();
        }
      });
      if (!pathIds) {
        fullRoot.each(d => {
          if (!pathIds && String(d.data.id).includes(q)) {
            pathIds = d.ancestors().map(a => a.data.id).reverse();
          }
        });
      }

      if (pathIds) {
        expandPath(pathIds);
        let found = null;
        root.each(d => {
          if (d.data.id === pathIds[pathIds.length - 1]) found = d;
        });
        if (found) {
          highlightedIds = new Set(found.ancestors().map(a => a.data.id));
          searchTargetId = found.data.id;
          update(root);
          setTimeout(() => {
            const scale = 0.9;
            const tx = width / 2 - found.y * scale;
            const ty = height / 2 - found.x * scale;
            svg.transition().duration(600)
              .call(zoomBehavior.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
          }, 350);
          const res = document.getElementById('searchResult');
          res.innerHTML =
            '<strong>找到節點</strong><br>名稱：' + escapeHtml(found.data.name) +
            '<br>ID：' + found.data.id +
            '<br>盈虧：' + formatNumber(found.data.winloss);
          res.classList.add('visible');
          return;
        }
      }

      highlightedIds.clear();
      searchTargetId = null;
      update(root);
      const res = document.getElementById('searchResult');
      res.innerHTML = '<strong>找不到</strong><br>沒有符合「' + escapeHtml(q) + '」的用戶 ID';
      res.classList.add('visible');
    }

    function expandPath(pathIds) {
      function walk(node, remaining) {
        if (!remaining.length) return;
        if (node._children) {
          node.children = node._children;
          node._children = null;
        }
        if (node.children) {
          const child = node.children.find(c => c.data.id === remaining[0]);
          if (child) walk(child, remaining.slice(1));
        }
      }
      walk(root, pathIds.slice(1));
    }

    init();
  </script>
