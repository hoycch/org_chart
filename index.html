<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ledger Tree · Account Hierarchy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0e14;
    --bg-grid:#0d131b;
    --panel:#111823;
    --panel-2:#151f2c;
    --line:#223140;
    --line-soft:#1a2530;
    --text:#e7ecf2;
    --text-dim:#8aa0b4;
    --text-faint:#516375;
    --teal:#4fd8c4;
    --teal-dim:#2c5f57;
    --gold:#e8b75e;
    --gold-dim:#4a3d20;
    --red:#e5636b;
    --red-dim:#4a2226;
    --gray:#55677a;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    overflow:hidden;
    -webkit-tap-highlight-color: transparent;
  }
  body{
    background-image:
      radial-gradient(circle at 15% 8%, rgba(79,216,196,0.05), transparent 40%),
      radial-gradient(circle at 85% 92%, rgba(232,183,94,0.04), transparent 45%);
  }

  #app{ position:fixed; inset:0; display:flex; flex-direction:column; }

  /* Header */
  header{
    flex:0 0 auto;
    padding:14px 16px 12px;
    background:linear-gradient(180deg, var(--panel), rgba(17,24,35,0.85));
    border-bottom:1px solid var(--line);
    position:relative; z-index:20;
  }
  .titlebar{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .titlebar h1{
    font-family:'Space Grotesk', sans-serif;
    font-size:18px; font-weight:600; letter-spacing:0.2px; margin:0;
    display:flex; align-items:center; gap:8px;
  }
  .titlebar h1 .dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--teal);
    box-shadow:0 0 8px 1px rgba(79,216,196,0.7);
  }
  .stat-line{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; color:var(--text-faint);
    margin-top:2px;
  }
  .stat-line b{ color:var(--text-dim); font-weight:500; }

  .toolbar{
    margin-top:10px;
    display:flex; gap:8px; align-items:center;
  }
  .search-wrap{
    position:relative; flex:1; min-width:0;
  }
  .search-wrap input{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    padding:9px 34px 9px 12px;
    border-radius:8px;
    outline:none;
  }
  .search-wrap input:focus{ border-color:var(--teal); }
  .search-wrap input::placeholder{ color:var(--text-faint); }
  .search-clear{
    position:absolute; right:6px; top:50%; transform:translateY(-50%);
    width:22px; height:22px; border-radius:6px; border:none;
    background:transparent; color:var(--text-faint);
    display:none; align-items:center; justify-content:center;
    cursor:pointer; font-size:14px;
  }
  .search-wrap.has-val .search-clear{ display:flex; }

  .icon-btn{
    flex:0 0 auto;
    width:36px; height:36px; border-radius:8px;
    background:var(--panel-2); border:1px solid var(--line);
    color:var(--text-dim);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:15px;
    font-family:'IBM Plex Mono', monospace;
  }
  .icon-btn:active{ background:var(--teal-dim); color:var(--teal); border-color:var(--teal-dim); }

  #search-results{
    position:absolute; left:16px; right:16px; top:100%;
    margin-top:6px;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:8px;
    max-height:260px; overflow-y:auto;
    display:none;
    z-index:30;
    box-shadow:0 12px 24px rgba(0,0,0,0.4);
  }
  #search-results.show{ display:block; }
  .sr-item{
    padding:9px 12px; border-bottom:1px solid var(--line-soft);
    cursor:pointer; display:flex; justify-content:space-between; gap:10px;
    font-size:12.5px;
  }
  .sr-item:last-child{ border-bottom:none; }
  .sr-item:active{ background:var(--teal-dim); }
  .sr-name{ color:var(--text); font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sr-id{ color:var(--text-faint); font-family:'IBM Plex Mono', monospace; font-size:11px; flex:0 0 auto; }
  .sr-empty{ padding:14px 12px; color:var(--text-faint); font-size:12.5px; }

  /* Legend */
  .legend{
    display:flex; gap:12px; flex-wrap:wrap;
    margin-top:10px; font-size:10.5px; color:var(--text-dim);
    font-family:'IBM Plex Mono', monospace;
  }
  .legend span{ display:inline-flex; align-items:center; gap:5px; }
  .legend i{ width:8px; height:8px; border-radius:2px; display:inline-block; }

  /* Canvas */
  #canvas-wrap{ position:relative; flex:1 1 auto; overflow:hidden; touch-action:none; }
  svg{ width:100%; height:100%; display:block; cursor:grab; }
  svg:active{ cursor:grabbing; }

  .link{ fill:none; stroke:var(--line); stroke-width:1.4; }
  .link.on-path{ stroke:var(--teal); stroke-width:1.8; }

  .node{ cursor:pointer; }
  .node .card{
    fill:var(--panel-2);
    stroke:var(--line);
    stroke-width:1;
  }
  .node.root .card{ fill:var(--panel); stroke:var(--teal-dim); stroke-width:1.4; }
  .node.highlight .card{ stroke:var(--teal); stroke-width:1.6; }
  .node:active .card{ fill:var(--line-soft); }

  .node .name{
    font-family:'Inter', sans-serif; font-size:11.5px; font-weight:500;
    fill:var(--text);
  }
  .node .idtext{
    font-family:'IBM Plex Mono', monospace; font-size:9px;
    fill:var(--text-faint);
  }
  .node .chip-text{
    font-family:'IBM Plex Mono', monospace; font-size:9.5px; font-weight:600;
  }
  .node .badge-text{
    font-family:'IBM Plex Mono', monospace; font-size:8.5px; font-weight:600;
    fill:var(--bg);
  }
  .node .toggle-ring{ fill:none; stroke:var(--line); stroke-width:1.2; }
  .node .toggle-plus{ stroke:var(--text-dim); stroke-width:1.4; }
  .node.root .toggle-ring{ stroke:var(--teal-dim); }

  /* Zoom controls */
  .zoom-controls{
    position:absolute; right:14px; bottom:18px; z-index:15;
    display:flex; flex-direction:column; gap:8px;
  }
  .zoom-controls button{
    width:38px; height:38px; border-radius:10px;
    background:rgba(17,24,35,0.9); border:1px solid var(--line);
    color:var(--text-dim); font-size:17px;
    backdrop-filter: blur(4px);
  }
  .zoom-controls button:active{ background:var(--teal-dim); color:var(--teal); }

  .hint{
    position:absolute; left:14px; bottom:18px; z-index:15;
    font-family:'IBM Plex Mono', monospace; font-size:10px;
    color:var(--text-faint);
    background:rgba(17,24,35,0.75);
    padding:6px 9px; border-radius:6px;
    border:1px solid var(--line-soft);
    pointer-events:none;
    transition:opacity 0.6s ease;
  }

  @media (prefers-reduced-motion: reduce){
    * { transition:none !important; animation:none !important; }
  }
</style>
</head>

  </div>
</div>

/* ---------- helpers ---------- */
function parseWL(wl){
  if(wl === "" || wl === undefined || wl === null) return {kind:'none', value:0};
  if(wl === '虧損') return {kind:'loss', value:0};
  const n = parseFloat(String(wl).replace(/,/g,''));
  if(isNaN(n)) return {kind:'none', value:0};
  if(n === 0) return {kind:'zero', value:0};
  return {kind:'pos', value:n};
}
function fmtWL(wl){
  if(wl === '虧損') return '虧損';
  if(wl === "" || wl === undefined) return '';
  const n = parseFloat(String(wl).replace(/,/g,''));
  if(isNaN(n)) return wl;
  const formatted = n.toLocaleString(undefined,{minimumFractionDigits:0, maximumFractionDigits:2});
  return n > 0 ? '賺' + formatted : formatted;
}
function colorFor(kind){
  switch(kind){
    case 'loss': return {fg:'var(--red)', bg:'var(--red-dim)'};
    case 'pos': return {fg:'var(--gold)', bg:'var(--gold-dim)'};
    default: return {fg:'var(--gray)', bg:'rgba(85,103,122,0.18)'};
  }
}
function countDescendants(d){
  let n = 0;
  if(d.children) n += d.children.length + d.children.reduce((a,c)=>a+countDescendants(c),0);
  else if(d._children) n += d._children.length + d._children.reduce((a,c)=>a+countDescendants(c),0);
  return n;
}

/* ---------- layout constants ---------- */
const NODE_W = 176;
const NODE_H = 46;
const LEVEL_GAP = 208;
const SIB_GAP = 14;
const TREE_GAP = 46; // vertical gap between independent trees in the forest

const svg = d3.select('#tree-svg');
const gZoom = svg.append('g').attr('class','zoom-layer');
const gLinks = gZoom.append('g').attr('class','links-layer');
const gNodes = gZoom.append('g').attr('class','nodes-layer');

let i = 0;
const duration = 260;

const treeLayout = d3.tree()
  .nodeSize([NODE_H + SIB_GAP, LEVEL_GAP])
  .separation((a,b)=> a.parent === b.parent ? 1 : 1.3);

function buildHierarchy(data){
  const h = d3.hierarchy(data, d => d.children);
  h.each(d => { d.id = d.data.id; });
  h.x0 = 0; h.y0 = 0;
  return h;
}

// RAW_DATA is now a real forest: an array of independent trees, each rooted
// at an account that actually exists in the source data (no invented parents).
const forest = RAW_DATA.map(buildHierarchy);

// default: show each tree's own root card, collapse everything beneath it
function collapseDeep(d){
  if(d.children){
    d._children = d.children;
    d._children.forEach(collapseDeep);
    d.children = null;
  }
}
function expandAll(d){
  if(d._children){ d.children = d._children; d._children = null; }
  if(d.children) d.children.forEach(expandAll);
}
function collapseAll(d, isRoot){
  if(d.children){
    d._children = d.children;
    d._children.forEach(c=>collapseAll(c,false));
    if(!isRoot) d.children = null;
  } else if(d._children){
    d._children.forEach(c=>collapseAll(c,false));
  }
}
forest.forEach(t => collapseDeep(t));

/* stats */
function totalNodes(d){
  let n = 1;
  const kids = d.children || d._children;
  if(kids) kids.forEach(c => n += totalNodes(c));
  return n;
}
function maxDepth(d){
  const kids = d.children || d._children;
  if(!kids || !kids.length) return d.depth;
  return Math.max(...kids.map(maxDepth));
}
document.getElementById('stat-total').textContent = forest.reduce((a,t)=>a+totalNodes(t),0).toLocaleString();
document.getElementById('stat-roots').textContent = forest.length;
document.getElementById('stat-depth').textContent = Math.max(...forest.map(maxDepth));

/* ---------- zoom/pan ---------- */
const zoom = d3.zoom()
  .scaleExtent([0.15, 2.5])
  .on('zoom', (event) => { gZoom.attr('transform', event.transform); });
svg.call(zoom);

function centerView(instant){
  const wrap = document.getElementById('canvas-wrap');
  const w = wrap.clientWidth, h = wrap.clientHeight;
  // center vertically on the first (largest) tree's root, near the left edge
  const firstRootY = forest[0] ? forest[0].y : 0;
  const t = d3.zoomIdentity.translate(40, h/2 - firstRootY*0.85).scale(0.85);
  if(instant) svg.call(zoom.transform, t);
  else svg.transition().duration(400).call(zoom.transform, t);
}

document.getElementById('zoom-in').onclick = () => svg.transition().duration(200).call(zoom.scaleBy, 1.3);
document.getElementById('zoom-out').onclick = () => svg.transition().duration(200).call(zoom.scaleBy, 0.75);
document.getElementById('zoom-reset').onclick = () => centerView(false);

/* ---------- render ---------- */
function update(source){
  // lay out each tree independently, then stack them vertically so
  // separate trees never overlap regardless of how expanded they are
  let cursor = 0;
  let nodes = [], links = [];
  forest.forEach(t => {
    treeLayout(t);
    const tNodes = t.descendants();
    const tLinks = t.links();
    // swap x/y for left-to-right orientation
    tNodes.forEach(d => { const tmp = d.x; d.x = d.y; d.y = tmp; });
    const minY = Math.min(...tNodes.map(d => d.y));
    const maxY = Math.max(...tNodes.map(d => d.y));
    const offset = cursor - minY;
    tNodes.forEach(d => { d.y += offset; });
    cursor = maxY + offset + NODE_H + TREE_GAP;
    nodes = nodes.concat(tNodes);
    links = links.concat(tLinks);
  });

  /* NODES */
  const node = gNodes.selectAll('g.node')
    .data(nodes, d => d.id || (d.id = ++i));

  const nodeEnter = node.enter().append('g')
    .attr('class', d => 'node' + (d.depth===0 ? ' root' : ''))
    .attr('transform', d => `translate(${source.x0},${source.y0})`)
    .on('click', (event, d) => {
      if(d.children){ d._children = d.children; d.children = null; }
      else if(d._children){ d.children = d._children; d._children = null; }
      update(d);
    });

  nodeEnter.append('rect')
    .attr('class','card')
    .attr('width', NODE_W).attr('height', NODE_H)
    .attr('x', -NODE_W/2).attr('y', -NODE_H/2)
    .attr('rx', 9);

  // amount chip (left accent bar)
  nodeEnter.append('rect')
    .attr('class','chip-bar')
    .attr('width', 4).attr('height', NODE_H-14)
    .attr('x', -NODE_W/2).attr('y', -(NODE_H-14)/2)
    .attr('rx', 2)
    .attr('fill', d => d.data.id==='root' ? 'transparent' : colorFor(parseWL(d.data.wl).kind).fg);

  nodeEnter.append('text')
    .attr('class','name')
    .attr('x', -NODE_W/2 + 14).attr('y', -4)
    .text(d => {
      const nm = String(d.data.name || '');
      return nm.length > 15 ? nm.slice(0,14)+'…' : nm;
    });

  nodeEnter.append('text')
    .attr('class','idtext')
    .attr('x', -NODE_W/2 + 14).attr('y', 10)
    .text(d => d.data.id === 'root' ? '' : `#${d.data.id}`);

  nodeEnter.append('text')
    .attr('class','chip-text')
    .attr('x', NODE_W/2 - 10).attr('y', 10)
    .attr('text-anchor','end')
    .attr('fill', d => colorFor(parseWL(d.data.wl).kind).fg)
    .text(d => d.data.id==='root' ? '' : fmtWL(d.data.wl));

  // toggle indicator circle at right edge when node has (collapsed) children
  const toggle = nodeEnter.filter(d => d.children || d._children)
    .append('g').attr('class','toggle').attr('transform', `translate(${NODE_W/2}, 0)`);

  toggle.append('circle').attr('class','toggle-ring').attr('r', 13);
  toggle.append('text')
    .attr('class','badge-text')
    .attr('text-anchor','middle')
    .attr('dy', 3)
    .attr('fill', 'var(--text-dim)')
    .text(d => d._children ? shortNum(d._children.length + d._children.reduce((a,c)=>a+countDescendants(c),0)) : '−');

  const nodeUpdate = nodeEnter.merge(node);

  nodeUpdate.transition().duration(duration)
    .attr('transform', d => `translate(${d.x},${d.y})`);

  nodeUpdate.select('.toggle-ring')
    .attr('fill', d => d._children ? 'var(--panel-2)' : 'none');
  nodeUpdate.selectAll('g.toggle text')
    .text(d => d._children ? shortNum(d._children.length + d._children.reduce((a,c)=>a+countDescendants(c),0)) : '−');

  const nodeExit = node.exit().transition().duration(duration)
    .attr('transform', d => `translate(${source.x},${source.y})`)
    .remove();

  /* LINKS */
  const link = gLinks.selectAll('path.link')
    .data(links, d => d.target.id);

  const linkEnter = link.enter().insert('path','g')
    .attr('class','link')
    .attr('d', d => {
      const o = {x: source.x0, y: source.y0};
      return diagonal(o,o);
    });

  linkEnter.merge(link).transition().duration(duration)
    .attr('d', d => diagonal(d.source, d.target));

  link.exit().transition().duration(duration)
    .attr('d', d => {
      const o = {x: source.x, y: source.y};
      return diagonal(o,o);
    }).remove();

  nodes.forEach(d => { d.x0 = d.x; d.y0 = d.y; });
}

function diagonal(s, t){
  return `M ${s.x} ${s.y}
          C ${(s.x+t.x)/2} ${s.y},
            ${(s.x+t.x)/2} ${t.y},
            ${t.x} ${t.y}`;
}
function shortNum(n){
  if(n >= 1000) return (n/1000).toFixed(1)+'k';
  return String(n);
}

update(forest[0]);
centerView(true);

/* ---------- search ---------- */
const searchInput = document.getElementById('search');
const searchWrap = document.getElementById('search-wrap');
const resultsBox = document.getElementById('search-results');
const searchClear = document.getElementById('search-clear');

function flatten(d, acc){
  acc.push(d);
  const kids = d.children || d._children;
  if(kids) kids.forEach(c => flatten(c, acc));
  return acc;
}

function flattenForest(){
  let all = [];
  forest.forEach(t => flatten(t, all));
  return all;
}

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  searchWrap.classList.toggle('has-val', q.length>0);
  if(!q){ resultsBox.classList.remove('show'); return; }
  const all = flattenForest();
  const matches = all.filter(d =>
    String(d.data.id).toLowerCase().includes(q) ||
    String(d.data.name).toLowerCase().includes(q)
  ).slice(0, 30);

  resultsBox.innerHTML = '';
  if(!matches.length){
    resultsBox.innerHTML = '<div class="sr-empty">No accounts match “'+q+'”</div>';
  } else {
    matches.forEach(d => {
      const row = document.createElement('div');
      row.className = 'sr-item';
      row.innerHTML = `<span class="sr-name">${escapeHtml(String(d.data.name))}</span><span class="sr-id">#${d.data.id}</span>`;
      row.onclick = () => { focusNode(d); resultsBox.classList.remove('show'); };
      resultsBox.appendChild(row);
    });
  }
  resultsBox.classList.add('show');
});
searchClear.onclick = () => { searchInput.value=''; searchWrap.classList.remove('has-val'); resultsBox.classList.remove('show'); };

function escapeHtml(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function findLive(targetId){
  return flattenForest().find(d => d.data.id === targetId);
}

function focusNode(target){
  // expand ancestors
  let d = target;
  const chain = [];
  while(d){ chain.unshift(d); d = d.parent; }
  chain.forEach(node => {
    if(node._children){ node.children = node._children; node._children = null; }
  });
  update(target);

  // after transition, locate live node & pan to it
  setTimeout(() => {
    const live = findLive(target.data.id);
    if(!live) return;
    const wrap = document.getElementById('canvas-wrap');
    const w = wrap.clientWidth, h = wrap.clientHeight;
    const scale = 0.9;
    const t = d3.zoomIdentity.translate(w*0.32 - live.x*scale, h/2 - live.y*scale).scale(scale);
    svg.transition().duration(500).call(zoom.transform, t);

    const g = gNodes.selectAll('g.node').filter(nd => nd.data.id === target.data.id);
    g.classed('highlight', true);
    setTimeout(()=>g.classed('highlight', false), 1800);
  }, duration + 40);
}

/* click outside to close results */
document.addEventListener('click', (e) => {
  if(!searchWrap.contains(e.target)) resultsBox.classList.remove('show');
});

/* toolbar buttons */
document.getElementById('btn-expand').onclick = () => {
  forest.forEach(t => expandAll(t));
  update(forest[0]);
};
document.getElementById('btn-collapse').onclick = () => {
  forest.forEach(t => collapseDeep(t));
  update(forest[0]);
  centerView(false);
};

/* fade hint after a few seconds */
setTimeout(()=>{ document.getElementById('hint').style.opacity = '0'; }, 4500);

/* resize handling */
window.addEventListener('resize', () => {});
</script>
