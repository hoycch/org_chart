<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Org Chart - Win/Loss</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f4f6f8;
    }
    .chart-container {
      width: 100vw;
      height: 100vh;
    }
    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 18px;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="loading">Loading data...</div>
  <div class="chart-container"></div>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-org-chart@3"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-flextree@2.1.2/build/d3-flextree.js"></script>

  <script>
    // Load your CSV
    d3.csv("data.csv").then(raw => {
      document.querySelector('.loading').style.display = 'none';

      // Transform to the format d3-org-chart expects
      const data = raw.map(d => ({
        id: d.userId,
        parentId: d.pid || null,          // empty pid becomes root
        display_name: d.display_name,
        WinLoss: d.WinLoss
      }));

      // Create the chart
      const chart = new d3.OrgChart()
        .container('.chart-container')
        .data(data)
        .nodeWidth(d => 220)
        .nodeHeight(d => 90)
        .childrenMargin(d => 40)
        .compactMarginBetween(d => 20)
        .compactMarginPair(d => 30)
        .nodeContent(function (d) {
          const winLoss = d.data.WinLoss || '';
          const isLoss = winLoss.includes('虧損') || winLoss.startsWith('-');
          const color = isLoss ? '#c0392b' : '#27ae60';

          return `
            <div style="
              width: 200px;
              height: 74px;
              padding: 10px 12px;
              background: white;
              border: 1px solid #ddd;
              border-radius: 8px;
              box-shadow: 0 2px 6px rgba(0,0,0,0.08);
              display: flex;
              flex-direction: column;
              justify-content: center;
            ">
              <div style="font-weight: 600; font-size: 13px; color: #222; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                ${d.data.display_name || d.data.id}
              </div>
              <div style="font-size: 13px; margin-top: 4px; color: ${color}; font-weight: 500;">
                ${winLoss}
              </div>
            </div>
          `;
        })
        .render();

      // Optional: fit the chart to screen after rendering
      setTimeout(() => chart.fit(), 300);

    }).catch(err => {
      document.querySelector('.loading').textContent = 
        'Error loading data.csv. Make sure the file is in the same folder.';
      console.error(err);
    });
  </script>
</body>
</html>
