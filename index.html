<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive Org Chart - d3-org-chart</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8f9fa;
    }
    .chart-container {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <div class="chart-container"></div>

  <!-- Load d3 and d3-org-chart from CDN -->
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-org-chart@3"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-flextree@2.1.2/build/d3-flextree.js"></script>

  <script>
    // 5-layer sample data (flat format)
    const data = [
      { id: "1", parentId: null, name: "Alex Rivera", title: "Chief Executive Officer" },
      { id: "2", parentId: "1", name: "Jordan Lee", title: "Chief Technology Officer" },
      { id: "3", parentId: "1", name: "Taylor Brooks", title: "Chief Financial Officer" },
      { id: "4", parentId: "1", name: "Morgan Blake", title: "Chief People Officer" },
      { id: "5", parentId: "2", name: "Sam Patel", title: "VP of Engineering" },
      { id: "6", parentId: "2", name: "Casey Nguyen", title: "VP of Product" },
      { id: "7", parentId: "3", name: "Jordan Hayes", title: "VP of Finance" },
      { id: "8", parentId: "4", name: "Riley Sutton", title: "VP of People Operations" },
      { id: "11", parentId: "5", name: "Taylor Kim", title: "Engineering Manager - Platform" },
      { id: "12", parentId: "5", name: "Morgan Ellis", title: "Engineering Manager - Product" },
      { id: "13", parentId: "6", name: "Drew Foster", title: "Product Manager - Core" },
      { id: "14", parentId: "7", name: "Alex Rivera Jr.", title: "Finance Manager" },
      { id: "15", parentId: "8", name: "Quinn Harper", title: "HR Manager" },
      { id: "21", parentId: "11", name: "Casey Morgan", title: "Senior Backend Engineer" },
      { id: "22", parentId: "11", name: "Riley Quinn", title: "Senior Frontend Engineer" },
      { id: "23", parentId: "11", name: "Avery Brooks", title: "DevOps Engineer" },
      { id: "24", parentId: "12", name: "Jamie Torres", title: "Full-stack Engineer" },
      { id: "25", parentId: "12", name: "Cameron Reed", title: "Mobile Engineer" },
      { id: "26", parentId: "13", name: "Harper Lane", title: "Associate Product Manager" },
      { id: "27", parentId: "14", name: "Skyler James", title: "Financial Analyst" },
      { id: "28", parentId: "14", name: "Peyton Clarke", title: "Accountant" },
      { id: "29", parentId: "15", name: "Dakota Miles", title: "HR Business Partner" },
      { id: "30", parentId: "15", name: "Emerson Cole", title: "Talent Acquisition Specialist" }
    ];

    // Create the chart
    const chart = new d3.OrgChart()
      .container('.chart-container')
      .data(data)
      .nodeWidth(d => 230)
      .nodeHeight(d => 110)
      .childrenMargin(d => 50)
      .compactMarginBetween(d => 25)
      .compactMarginPair(d => 40)
      .nodeContent(function (d) {
        return `
          <div style="
            width: 210px;
            height: 90px;
            padding: 12px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            justify-content: center;
          ">
            <div style="font-weight: 600; font-size: 14px; color: #1a1a1a;">
              ${d.data.name}
            </div>
            <div style="font-size: 12px; color: #666; margin-top: 4px;">
              ${d.data.title}
            </div>
          </div>
        `;
      })
      .render();
  </script>
</body>
</html>
